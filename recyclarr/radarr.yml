# Recyclarr v8 config for Radarr. Synced nightly (see CRON_SCHEDULE in compose).
# API key comes from the container env, never from this file.
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    # Naming: run `docker exec recyclarr recyclarr list naming radarr`, pick the
    # Jellyfin-flavoured keys from the "Key" column, then uncomment:
    # media_naming:
    #   folder: <key>
    #   movie:
    #     rename: true
    #     standard: <key>
